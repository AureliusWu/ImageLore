name: Format ImageLore source once

on:
  push:
    branches: [main]
    paths:
      - 'biome.json'

concurrency:
  group: imagelore-format-once
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format frontend source
        run: npx --yes @biomejs/biome@2.5.14 format --write src browser-extension scripts vite.config.ts --files-ignore-unknown=true
      - name: Format Rust source
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src browser-extension scripts vite.config.ts src-tauri
          if git diff --cached --quiet; then
            echo "Source is already formatted."
          else
            git commit -m "Format ImageLore source"
            git push
          fi
