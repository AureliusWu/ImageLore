name: ImageLore Native CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'maintenance/**']
    paths:
      - 'src-tauri/**'
      - 'VERSION'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'VERSION'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-ci.yml'

concurrency:
  group: imagelore-native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
