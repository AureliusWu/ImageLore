name: Render OG Preview

on:
  push:
    branches:
      - main
      - 'showcase/**'
    paths:
      - 'docs/og.svg'
      - '.github/workflows/render-og.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelore-og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install SVG renderer and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render 1280x640 PNG
        run: rsvg-convert docs/og.svg -w 1280 -h 640 -o docs/og.png

      - name: Upload rendered preview for reviewed integration
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-OG-preview
          path: docs/og.png
          if-no-files-found: error
          retention-days: 14
