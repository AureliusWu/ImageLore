name: Render OG Preview

on:
  push:
    branches:
      - main
      - 'showcase/**'
    paths:
      - 'docs/og.svg'
      - '.github/workflows/render-og.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagelore-og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install SVG renderer and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render 1280x640 PNG
        run: rsvg-convert docs/og.svg -w 1280 -h 640 -o docs/og.png

      - name: Commit rendered preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/og.png
          if git diff --cached --quiet; then
            echo "OG preview already up to date."
          else
            git commit -m "Render ImageLore OG preview"
            git push
          fi
