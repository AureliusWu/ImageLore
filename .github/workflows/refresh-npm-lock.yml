name: Refresh npm lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-npm-lock.yml'
  workflow_dispatch:

concurrency:
  group: imagelore-refresh-npm-lock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Refresh npm lockfile for Tauri 2.12"
          git push
