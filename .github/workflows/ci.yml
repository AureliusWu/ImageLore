name: ImageLore CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: imagelore-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version sync is idempotent
        shell: pwsh
        run: |
          npm run version:sync
          if (git status --porcelain) {
            git status --short
            throw "Version targets are not synchronized with VERSION"
          }

      - name: Verify project
        run: npm run check

      - name: Build frontend bundle
        run: npm run build
