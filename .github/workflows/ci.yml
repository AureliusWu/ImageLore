name: ImageLore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: imagelore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify project
        run: npm run check

      - name: Detect native changes
        id: changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            "rust=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = git diff --name-only $base $env:GITHUB_SHA
          $native = $changed | Where-Object {
            $_ -like "src-tauri/*" -or
            $_ -eq "VERSION"
          }
          if ($native) { "rust=true" >> $env:GITHUB_OUTPUT } else { "rust=false" >> $env:GITHUB_OUTPUT }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust check
        if: steps.changes.outputs.rust == 'true'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
