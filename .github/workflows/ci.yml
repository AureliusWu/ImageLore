name: ImageLore CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: imagelore-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify pinned upgrade baseline source identity checks
        run: python scripts/test_windows_upgrade_baseline.py

      - name: Verify distribution notices and release asset preparation
        shell: pwsh
        run: |
          python scripts/verify_distribution_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Source notice verification failed' }
          python scripts/test_distribution_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Notice regression failed' }
          python scripts/test_prepare_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset regression failed' }

      - name: Verify owned Windows ACL fixture lifecycle
        shell: pwsh
        run: |
          ./scripts/test_backup_acl_fixture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test_backup_acl_fixture.ps1 -LegacyDacl

      - name: Verify Windows release signature gate refusals
        shell: pwsh
        run: |
          ./scripts/test_windows_release_signatures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Strict signature regression failed' }
          ./scripts/test_windows_release_exceptions.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version sync is idempotent
        shell: pwsh
        run: |
          npm run version:sync
          if (git status --porcelain) {
            git status --short
            throw "Version targets are not synchronized with VERSION"
          }

      - name: Verify project
        run: npm run check

      - name: Build frontend bundle
        run: npm run build
