name: Refresh Cargo Lock

on:
  push:
    branches: [feature/v0.18.0-semantic-recall]
    paths:
      - 'src-tauri/Cargo.toml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.18.0-semantic-recall
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "Refresh Cargo.lock for semantic recall"
          git push origin HEAD:feature/v0.18.0-semantic-recall
