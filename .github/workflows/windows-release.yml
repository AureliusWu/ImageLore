name: Build ImageLore Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - '.github/windows-build-request.txt'

concurrency:
  group: imagelore-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version and lockfiles
        shell: pwsh
        run: |
          $triggerSourceSha = git rev-parse ($env:GITHUB_SHA + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve triggering commit" }
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $triggerSourceSha) {
            throw "Release checkout does not match the triggering SHA"
          }
          "IMAGELORE_RELEASE_SOURCE_SHA=$releaseSourceSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          npm run version:check
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }
          cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml > $null
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency check failed" }
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $expected = "v$((Get-Content VERSION).Trim())"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expected)"
            }
          }

      - name: Verify frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build NSIS setup EXE
        shell: pwsh
        run: |
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $env:IMAGELORE_RELEASE_SOURCE_SHA) {
            throw "Release source changed after verification"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Tracked sources changed during verification" }
          npm run tauri:build

      - name: Build v0.19.0 upgrade baseline
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP ("imagelore-v0.19.0-" + [Guid]::NewGuid().ToString("N"))
          if (Test-Path -LiteralPath $baseline) { throw "Upgrade baseline directory already exists" }
          git worktree add --detach "$baseline" 23959672b340524b6db9cf97298a4118f4668efb
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare upgrade baseline" }
          Push-Location $baseline
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "Baseline frontend dependency install failed" }
            npm run tauri:build
            if ($LASTEXITCODE -ne 0) { throw "Baseline installer build failed" }
          } finally {
            Pop-Location
          }
          $previous = Get-ChildItem "$baseline/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $previous) { throw "v0.19.0 baseline installer not found" }
          "IMAGELore_PREVIOUS_INSTALLER=$($previous.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGELore_PREVIOUS_SCHEMA=$baseline/src-tauri/schema.sql" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify in-place upgrade from v0.19.0
        shell: pwsh
        run: |
          $current = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $current) { throw "Current NSIS installer not found" }
          ./scripts/test_windows_upgrade.ps1 `
            -PreviousInstaller "$env:IMAGELore_PREVIOUS_INSTALLER" `
            -CurrentInstaller "$($current.FullName)" `
            -PreviousSchema "$env:IMAGELore_PREVIOUS_SCHEMA" `
            -PreviousVersion "0.19.0" `
            -CurrentVersion "$((Get-Content VERSION).Trim())"

      - name: Verify tested source before upload or publication
        shell: pwsh
        run: |
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $env:IMAGELORE_RELEASE_SOURCE_SHA) {
            throw "Installer source no longer matches the tested checkout"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Tracked sources changed after verification" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-Windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          gh release create "$env:GITHUB_REF_NAME" "$($installer.FullName)" --title "ImageLore $env:GITHUB_REF_NAME" --notes "Windows one-click installer."
