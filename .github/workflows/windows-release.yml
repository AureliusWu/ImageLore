name: Build ImageLore Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: imagelore-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version and lockfiles
        shell: pwsh
        run: |
          npm run version:check
          cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml > $null
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $expected = "v$((Get-Content VERSION).Trim())"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expected)"
            }
          }

      - name: Build NSIS setup EXE
        run: npm run tauri:build -- --locked

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-Windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          gh release create "$env:GITHUB_REF_NAME" "$($installer.FullName)" --title "ImageLore $env:GITHUB_REF_NAME" --notes "Windows one-click installer."
