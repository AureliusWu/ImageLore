name: Build ImageLore Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: imagelore-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version and lockfiles
        run: |
          npm run version:check
          cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml > NUL

      - name: Build NSIS setup EXE
        run: npm run tauri:build -- --locked

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-Windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ImageLore v__VERSION__'
          releaseBody: Windows one-click installer.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --locked
