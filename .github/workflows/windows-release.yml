name: Build ImageLore Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Sync and verify version
        run: |
          npm run version:sync
          npm run version:check

      - name: Build NSIS setup EXE
        run: npm run tauri:build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-Windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ImageLore v__VERSION__'
          releaseBody: |
            Windows one-click installer. Download the x64 setup EXE and double-click it.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
