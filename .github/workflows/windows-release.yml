name: Build ImageLore Windows Installer

on:
  workflow_dispatch:
    inputs:
      upload_installer:
        description: Upload the validated installer after distribution review
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - '.github/windows-build-request.txt'

concurrency:
  group: imagelore-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check sensitive information before building or uploading
        shell: pwsh
        run: |
          python scripts/test_sensitive_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Sensitive guard regression tests failed' }
          python scripts/check_sensitive.py --tracked --history
          if ($LASTEXITCODE -ne 0) { throw 'Sensitive information guard failed' }
          ./scripts/check_gitleaks.ps1

      - name: Verify Windows release signature gate refusals
        shell: pwsh
        run: ./scripts/test_windows_release_signatures.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify version and lockfiles
        shell: pwsh
        run: |
          $triggerSourceSha = git rev-parse ($env:GITHUB_SHA + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve triggering commit" }
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $triggerSourceSha) {
            throw "Release checkout does not match the triggering SHA"
          }
          "IMAGELORE_RELEASE_SOURCE_SHA=$releaseSourceSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          npm run version:check
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }
          cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml > $null
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency check failed" }
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $expected = "v$((Get-Content VERSION).Trim())"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expected)"
            }
          }

      - name: Require configured release signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          . ./scripts/windows_release_signatures.ps1
          $policy = Get-Content -LiteralPath src-tauri/windows-signing-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $null = @(Get-ApprovedReleaseCertificateHashes $policy)

      - name: Verify frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings

      - name: Build pinned upgrade baselines
        shell: pwsh
        run: |
          $baselines = @(
            @{ Version = '0.19.0'; Commit = 'cfe80c5dfa6e4290b6372910e2a98908193e0b13' },
            @{ Version = '0.25.1'; Commit = '6748b1259b8b2e8b2f150b067e7fbc6ee7c321c9' }
          )
          $built = @()
          foreach ($source in $baselines) {
            $baseline = Join-Path $env:RUNNER_TEMP ("imagelore-v$($source.Version)-" + [Guid]::NewGuid().ToString("N"))
            if (Test-Path -LiteralPath $baseline) { throw "Upgrade baseline directory already exists" }
            git worktree add --detach "$baseline" $source.Commit
            if ($LASTEXITCODE -ne 0) { throw "Could not prepare upgrade baseline" }
            Push-Location $baseline
            try {
              if ((git rev-parse HEAD) -ne $source.Commit -or (Get-Content VERSION).Trim() -ne $source.Version) {
                throw "Upgrade baseline source or version does not match its pin"
              }
              npm ci
              if ($LASTEXITCODE -ne 0) { throw "Baseline frontend dependency install failed" }
              npm run tauri:build
              if ($LASTEXITCODE -ne 0) { throw "Baseline installer build failed" }
              if ((git rev-parse HEAD) -ne $source.Commit -or (Get-Content VERSION).Trim() -ne $source.Version) {
                throw "Upgrade baseline source or version changed during build"
              }
              git diff --exit-code
              if ($LASTEXITCODE -ne 0) { throw "Tracked baseline sources changed during build" }
            } finally {
              Pop-Location
            }
            $previous = @(Get-ChildItem "$baseline/src-tauri/target/release/bundle/nsis/*.exe")
            if ($previous.Count -ne 1) { throw "Expected one baseline installer" }
            $built += @{ Version = $source.Version; Commit = $source.Commit; Installer = $previous[0].FullName; Schema = "$baseline/src-tauri/schema.sql" }
          }
          $manifest = Join-Path $env:RUNNER_TEMP ("imagelore-upgrade-baselines-" + [Guid]::NewGuid().ToString("N") + '.json')
          if (Test-Path -LiteralPath $manifest) { throw "Upgrade baseline manifest already exists" }
          $built | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $manifest -Encoding UTF8
          "IMAGELORE_UPGRADE_BASELINES=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build NSIS setup EXE
        shell: pwsh
        run: |
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $env:IMAGELORE_RELEASE_SOURCE_SHA) {
            throw "Release source changed after verification"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Tracked sources changed during verification" }
          npm run tauri:build

      - name: Verify in-place upgrades from v0.19.0 and v0.25.1
        shell: pwsh
        run: |
          $current = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $current) { throw "Current NSIS installer not found" }
          $baselines = @(Get-Content -LiteralPath $env:IMAGELORE_UPGRADE_BASELINES -Raw -Encoding UTF8 | ConvertFrom-Json)
          if ($baselines.Count -ne 2) { throw "Both pinned upgrade baselines are required" }
          foreach ($baseline in $baselines) {
            ./scripts/test_windows_upgrade.ps1 `
              -PreviousInstaller $baseline.Installer `
              -CurrentInstaller "$($current.FullName)" `
              -CurrentExecutable "src-tauri/target/release/imagelore.exe" `
              -PreviousSchema $baseline.Schema `
              -PreviousVersion $baseline.Version `
              -CurrentVersion "$((Get-Content VERSION).Trim())"
          }

      - name: Verify tested source before upload or publication
        shell: pwsh
        run: |
          $releaseSourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $releaseSourceSha -ne $env:IMAGELORE_RELEASE_SOURCE_SHA) {
            throw "Installer source no longer matches the tested checkout"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Tracked sources changed after verification" }

      - name: Verify release Authenticode signatures before publication
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          ./scripts/verify_windows_release_signatures.ps1 `
            -ApplicationPath "src-tauri/target/release/imagelore.exe" `
            -InstallerPath "$($installer.FullName)" `
            -ExpectedVersion "$((Get-Content VERSION).Trim())"

      - name: Upload Windows installer artifact
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.upload_installer)
        uses: actions/upload-artifact@v4
        with:
          name: ImageLore-Windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          gh release create "$env:GITHUB_REF_NAME" "$($installer.FullName)" --title "ImageLore $env:GITHUB_REF_NAME" --notes "Windows one-click installer."
