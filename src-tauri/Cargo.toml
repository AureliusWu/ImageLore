[package]
name = "imagelore"
version = "0.11.0"
description = "Local-first AI generation memory library"
authors = ["ImageLore"]
edition = "2021"

[lib]
name = "imagelore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
sha2 = "0.10"
walkdir = "2"
dirs = "6"
mime_guess = "2"
